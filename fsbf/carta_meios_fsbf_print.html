<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carta de Meios FSBF</title>
<style>
  :root{
    /* Paleta fiel ao original Excel/PDF */
    --verde-titulo:   #21A038;  /* barra de título e cabeçalhos verdes */
    --verde-claro:    #E2EFDA;  /* tint linhas GSBF */
    --azul-norte:     #1F7AC4;  /* BSBF NORTE */
    --azul-claro:     #DDEBF7;
    --vermelho-sul:   #FF0000;  /* BSBF SUL */
    --vermelho-claro: #FCE4E4;
    --laranja-mr:     #ED7D31;  /* Máquinas de Rasto */
    --cinza-claro:    #EDEDED;
    --amarelo-om:     #FFFF00;  /* Outros Meios */
    --amarelo-claro:  #FFFDE0;
    --amarelo-optel:  #FFE699;  /* célula OPTEL */
    --preto:          #000000;
    --borda:          #000000;
    --fonte: "Calibri", "Segoe UI", Arial, sans-serif;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    font-family:var(--fonte);
    font-size:10.5px;
    color:#000;
    background:#888;
  }

  .pagina{
    width:210mm;
    min-height:297mm;
    margin:10px auto;
    padding:8mm 8mm 10mm;
    background:#fff;
    box-shadow:0 2px 12px rgba(0,0,0,.35);
  }

  /* ===== Cabeçalho ===== */
  .cabecalho{
    display:flex;
    align-items:center;
    gap:6px;
    margin-bottom:6px;
  }
  .cabecalho img.icnf{ height:14mm; }
  .cabecalho .titulo{
    flex:1;
    background:var(--verde-titulo);
    color:#fff;
    font-size:20px;
    font-weight:bold;
    text-align:center;
    padding:5px 0;
  }
  .cabecalho img.emblema{ height:16mm; }

  /* ===== Tabelas ===== */
  table{ border-collapse:collapse; table-layout:fixed; }
  td,th{
    border:1px solid var(--borda);
    padding:1.5px 4px;
    height:16px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    text-align:center;
    vertical-align:middle;
  }
  th{ font-weight:bold; }
  td.esq{ text-align:left; }

  .bloco{ margin-bottom:9px; }

  /* rótulo de secção (célula isolada por cima da tabela) */
  .rotulo{
    display:inline-block;
    border:1px solid var(--borda);
    font-weight:bold;
    text-align:center;
    padding:1.5px 0;
    width:34mm;
    margin-bottom:0;
  }

  /* Coordenador de Dia */
  .t-coord{ width:52mm; }
  .t-coord th{ background:var(--verde-titulo); color:#fff; }

  /* Chefe de Grupo + OPTEL/Data */
  .linha-cg{ display:flex; justify-content:space-between; align-items:flex-start; }
  .t-cg th{ background:var(--verde-titulo); color:#fff; }
  .t-optel th.optel{ background:var(--amarelo-optel); color:#000; }
  .t-optel th.contacto{ background:var(--verde-titulo); color:#fff; }
  .t-optel th.data{ background:var(--preto); color:#fff; }

  /* Secções de equipas */
  .t-sec{ width:100%; }

  .sec-norte .rotulo, .sec-norte th{ background:var(--azul-norte); color:#fff; }
  .sec-norte tbody tr:nth-child(even) td{ background:var(--azul-claro); }

  .sec-sul .rotulo, .sec-sul th{ background:var(--vermelho-sul); color:#fff; }
  .sec-sul tbody tr:nth-child(even) td{ background:var(--vermelho-claro); }

  .sec-gsbf .rotulo, .sec-gsbf th{ background:var(--verde-titulo); color:#fff; }
  .sec-gsbf tbody tr:nth-child(even) td{ background:var(--verde-claro); }

  .sec-mr .rotulo, .sec-mr th{ background:var(--laranja-mr); color:#000; }
  .sec-mr tbody tr:nth-child(even) td{ background:var(--cinza-claro); }

  .sec-om .rotulo, .sec-om th{ background:var(--amarelo-om); color:#000; }
  .sec-om tbody tr:nth-child(even) td{ background:var(--amarelo-claro); }

  .sec-comp .rotulo, .sec-comp th{ background:var(--verde-titulo); color:#fff; }
  .sec-comp tbody tr:nth-child(even) td{ background:var(--verde-claro); }

  /* Totais */
  .total{
    display:flex;
    align-items:stretch;
    width:74mm;
    margin-top:10px;
    border:1px solid var(--borda);
  }
  .total .rot{
    flex:1;
    background:var(--verde-titulo);
    color:#fff;
    font-weight:bold;
    text-align:center;
    padding:2.5px 0;
  }
  .total .val{
    width:20mm;
    background:var(--preto);
    color:#fff;
    font-weight:bold;
    text-align:right;
    padding:2.5px 6px;
  }

  /* ===== Barra de ações (não imprime) ===== */
  .acoes{
    max-width:210mm;
    margin:8px auto 0;
    display:flex;
    gap:8px;
  }
  .acoes button{
    font-family:var(--fonte);
    font-size:14px;
    padding:6px 16px;
    border:none;
    border-radius:4px;
    background:var(--verde-titulo);
    color:#fff;
    cursor:pointer;
  }
  .acoes button:hover{ filter:brightness(1.1); }

  @page{ size:A4 portrait; margin:0; }
  @media print{
    body{ background:#fff; }
    .pagina{ margin:0; box-shadow:none; width:auto; min-height:auto; }
    .acoes{ display:none; }
    td,th{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .titulo,.rotulo,.total .rot,.total .val{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }
</style>
</head>

<div class="acoes">
  <button onclick="window.print()">🖨️ Imprimir / PDF</button>
</div>

    <div class="val" id="total-operacionais"></div>

      <thead>
        <tr>
          <th style="width:24mm">Companhia</th>
          <th style="width:18mm">Empenhados</th>
          <th style="width:14mm">Efetivo</th>
          <th>%</th>
        </tr>
      </thead>
      <tbody id="tbody-companhias"></tbody>

<script>
/* =====================================================================
   DADOS — substituir/gerar este objeto para cada carta diária.
   Compatível com meios_fsbf_YYYYMMDD.json (extração do Excel).
   ===================================================================== */
const DATA = window.__CARTA_DATA__ || {
  "documento": "Carta de Meios FSBF",
  "data": "2026-07-04",
  "coordenador_de_dia": { "nome": "José Motaco", "contacto": "968 341 365" },
  "chefe_de_grupo": {
    "nome": "Telmo Dias", "veiculo": "VM87", "matricula": "",
    "guarnicao": 2, "contacto": "910 846 946",
    "optel": "", "contacto_optel": "", "data": "04/07/2026"
  },
  "bsbf_norte": [
    { "base": "Macedo Cavaleiros", "veiculo": "VFCI 01", "matricula": "AU-28-IV", "guarnicao": 5, "chefe_equipa": "Hélder Pinelo", "contacto": "912 159 327", "observacoes": "" },
    { "base": "Macedo Cavaleiros", "veiculo": "VFCI 02", "matricula": "AU-34-IV", "guarnicao": 5, "chefe_equipa": "Paulo Silva", "contacto": "926 388 502", "observacoes": "Chefe BSBF" },
    { "base": "Macedo Cavaleiros", "veiculo": "VAOP 13", "matricula": "BF-91-ZZ", "guarnicao": 2, "chefe_equipa": "João Alves", "contacto": "920 265 622", "observacoes": "" }
  ],
  "bsbf_sul": [
    { "base": "Portalegre", "veiculo": "VFCI 04", "matricula": "AU-41-IV", "guarnicao": 5, "chefe_equipa": "João Batista", "contacto": "962 560 434", "observacoes": "Chefe BSBF" },
    { "base": "Santarém", "veiculo": "VFCI 05", "matricula": "AU-27-IV", "guarnicao": 5, "chefe_equipa": "Leandro Ferreira", "contacto": "914 366 270", "observacoes": "" }
  ],
  "gsbf": [
    { "local_pp": "", "veiculo": "", "matricula": "", "guarnicao": "", "chefe_equipa": "", "contacto": "", "observacoes": "Chefe de Grupo" }
  ],
  "maquinas_de_rasto": [
    { "base": "Guarda", "mr": "M03", "vaop": "VAOP 02", "vpiloto": "VTTP 14", "chefe_equipa": "", "contacto": "", "vlci": "VLCI 14", "total_op": "", "observacoes": "" },
    { "base": "Marinha Grande", "mr": "M15", "vaop": "VAOP 09", "vpiloto": "VTTP 16", "chefe_equipa": "", "contacto": "", "vlci": "", "total_op": "", "observacoes": "" },
    { "base": "Santarém", "mr": "M16", "vaop": "", "vpiloto": "", "chefe_equipa": "", "contacto": "", "vlci": "VLCI15", "total_op": "", "observacoes": "" }
  ],
  "outros_meios": [],
  "totais": { "meios": 9, "operacionais": 24 }
};

/* Número mínimo de linhas por secção (réplica da folha original) */
const MIN_LINHAS = { bsbf_norte: 4, bsbf_sul: 4, gsbf: 8, maquinas_de_rasto: 9, outros_meios: 12 };

/* Definição das secções: classe CSS, rótulo, colunas [cabeçalho, chave, largura mm] */
const SECCOES = [
  { id:"bsbf_norte", classe:"sec-norte", rotulo:"BSBF NORTE", cols:[
      ["Base","base",26,"esq"],["Veículo","veiculo",16],["Matrícula","matricula",18],
      ["Guarnição","guarnicao",14],["Chefe Equipa","chefe_equipa",24],["Contato","contacto",20],
      ["Ocorrência","ocorrencia",22],["Observações","observacoes",null,"esq"]]},
  { id:"bsbf_sul", classe:"sec-sul", rotulo:"BSBF SUL", cols:[
      ["Base","base",26,"esq"],["Veículo","veiculo",16],["Matrícula","matricula",18],
      ["Guarnição","guarnicao",14],["Chefe Equipa","chefe_equipa",24],["Contato","contacto",20],
      ["Ocorrência","ocorrencia",22],["Observações","observacoes",null,"esq"]]},
  { id:"gsbf", classe:"sec-gsbf", rotulo:"GSBF", cols:[
      ["Local PP","local_pp",26,"esq"],["Veículo","veiculo",16],["Matrícula","matricula",18],
      ["Guarnição","guarnicao",14],["Chefe Equipa","chefe_equipa",24],["Contato","contacto",20],
      ["Ocorrência","ocorrencia",22],["Observações","observacoes",null,"esq"]]},
  { id:"maquinas_de_rasto", classe:"sec-mr", rotulo:"Máquinas de Rasto", cols:[
      ["Base","base",22,"esq"],["MR","mr",12],["VAOP","vaop",15],["Vpiloto","vpiloto",14],
      ["Chefe Equipa","chefe_equipa",22],["Contato","contacto",18],["VLCI","vlci",14],
      ["Total Op.","total_op",12],["Ocorrência","ocorrencia",22],
      ["Observações","observacoes",null,"esq"]]},
  { id:"outros_meios", classe:"sec-om", rotulo:"Outros Meios", cols:[
      ["Base","base",26,"esq"],["Veículo","veiculo",16],["Matrícula","matricula",18],
      ["Guarnição","guarnicao",14],["Chefe Equipa","chefe_equipa",24],["Contato","contacto",20],
      ["Ocorrência","ocorrencia",22],["Observações","observacoes",null,"esq"]]}
];

const esc = v => (v === null || v === undefined) ? "" :
  String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function render(data){
  // Cabeçalhos fixos
  document.getElementById("coord-nome").textContent      = data.coordenador_de_dia.nome;
  document.getElementById("coord-contacto").textContent  = data.coordenador_de_dia.contacto;
  const cg = data.chefe_de_grupo;
  document.getElementById("cg-nome").textContent      = cg.nome;
  document.getElementById("cg-veiculo").textContent   = cg.veiculo;
  document.getElementById("cg-matricula").textContent = cg.matricula;
  document.getElementById("cg-guarnicao").textContent = cg.guarnicao ?? "";
  document.getElementById("cg-contacto").textContent  = cg.contacto;
  document.getElementById("optel").textContent          = cg.optel ?? "";
  document.getElementById("optel-contacto").textContent = cg.contacto_optel ?? "";
  document.getElementById("data-carta").textContent     = cg.data || data.data;

  // Secções
  let html = "";
  for (const sec of SECCOES){
    const registos = (data[sec.id] || []).slice();
    const min = MIN_LINHAS[sec.id] || registos.length;
    while (registos.length < min) registos.push({});

    html += `<div class="bloco ${sec.classe}">`;
    html += `<div class="rotulo">${sec.rotulo}</div>`;
    html += `<table class="t-sec"><thead><tr>`;
    for (const [cab,,w] of sec.cols)
      html += `<th${w ? ` style="width:${w}mm"` : ""}>${cab}</th>`;
    html += `</tr></thead><tbody>`;
    for (const r of registos){
      html += `<tr>`;
      for (const [,chave,,alinh] of sec.cols)
        html += `<td${alinh ? ` class="${alinh}"` : ""}>${esc(r[chave])}</td>`;
      html += `</tr>`;
    }
    html += `</tbody></table></div>`;
  }
  document.getElementById("seccoes").innerHTML = html;

  // Totais: usa os declarados no JSON ou calcula
  const t = data.totais || {};
  const nMeios = t.meios ?? (
    (cg.veiculo ? 1 : 0) +
    ["bsbf_norte","bsbf_sul","gsbf","maquinas_de_rasto","outros_meios"]
      .reduce((s,k) => s + (data[k]||[]).filter(r => r.veiculo || r.mr || r.meio).length, 0)
  );
  const nOp = t.operacionais ?? (
    (Number(cg.guarnicao)||0) +
    ["bsbf_norte","bsbf_sul","gsbf"].reduce((s,k) =>
      s + (data[k]||[]).reduce((a,r) => a + (Number(r.guarnicao)||0), 0), 0) +
    (data.maquinas_de_rasto||[]).reduce((a,r) => a + (Number(r.total_op)||0), 0) +
    (data.outros_meios||[]).reduce((a,r) => a + (Number(r.guarnicao)||0), 0)
  );
  document.getElementById("total-meios").textContent = nMeios;
  document.getElementById("total-operacionais").textContent = nOp;

  // Empenhamento por companhia: percentagem sobre o efetivo de cada companhia,
  // pelo que as linhas não somam 100%.
  const comp = (t.por_companhia)||[];
  const blocoComp = document.getElementById("bloco-companhias");
  if(!comp.length){ blocoComp.style.display = "none"; }
  else {
    blocoComp.style.display = "";
    document.getElementById("tbody-companhias").innerHTML = comp.map(c => `<tr>
      <td class="esq">${esc(c.companhia)}</td>
      <td>${esc(c.n)}</td>
      <td>${esc(c.efetivo)}</td>
      <td>${String(c.pct).replace(".", ",")}%</td>
    </tr>`).join("");
  }
}

render(DATA);
</script>
